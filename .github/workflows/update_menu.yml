name: 小红书菜单自动扩充 (Spider_XHS 引擎)

on:
  schedule:
    # 设定为每周一 UTC 时间凌晨 0 点运行 (北京时间早上 8 点)
    - cron: '0 0 * * 1'
  workflow_dispatch: # 开启手动点击运行按钮

jobs:
  run-updater:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      
    steps:
      - name: 获取本地代码库
        uses: actions/checkout@v4  # 已升级至 v4，消除过时警告

      - name: 检出 Spider_XHS 核心爬虫引擎
        run: git clone https://github.com/cv-cat/Spider_XHS.git

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4  # 已升级至 v4
        with:
          node-version: '20' 

      - name: 配置 Python 环境
        uses: actions/setup-python@v5  # 已升级至 v5
        with:
          python-version: '3.10'

      - name: 安装后端专属依赖库 (解决 Streamlit 冲突)
        run: |
          cd Spider_XHS && npm install
          cd ..
          # 强制在此处安装大模型和请求库，不再读取根目录的 requirements.txt
          pip install google-generativeai requests
          pip install -r Spider_XHS/requirements.txt

      - name: 执行数据抓取与大模型分析
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XHS_COOKIE: ${{ secrets.XHS_COOKIE }}
        run: python update_menu.py

      - name: 提交并推送最新数据 (已加入防冲突保险)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add menu_data.json
          git commit -m "Auto-update: 使用 Spider_XHS 获取最新食谱" || echo "无新数据更新"
          git pull --rebase origin main  # 智能合并人工修改，防止 push 失败
          git push
