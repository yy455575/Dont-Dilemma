name: 小红书菜单自动扩充 (Spider_XHS 引擎)

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch: 

jobs:
  run-updater:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # 🌟 新增：响应官方号召，强制底层动作使用 Node 24 消除预警

    steps:
      - name: 获取本地代码库
        uses: actions/checkout@v4

      - name: 检出 Spider_XHS 核心爬虫引擎
        run: git clone https://github.com/cv-cat/Spider_XHS.git

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '24'  # 🌟 更新：将运行环境也主动拉高到 24 版本

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装后端专属依赖库
        run: |
          npm install crypto-js  # 🌟 核心修复：强制在根目录安装这个缺失的加密包！
          cd Spider_XHS && npm install
          cd ..
          # 🌟 核心修改：将 google-generativeai 替换为全新的 google-genai
          pip install google-genai requests
          pip install -r Spider_XHS/requirements.txt

      - name: 执行数据抓取与大模型分析
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XHS_COOKIE: ${{ secrets.XHS_COOKIE }}
        run: python update_menu.py

      - name: 提交并推送最新数据
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add menu_data.json
          git commit -m "Auto-update: 使用 Spider_XHS 获取最新食谱" || echo "无新数据更新"
          git pull --rebase origin main
          git push
