name: 每周菜单自动扩充

on:
  schedule:
    # 设定为每周一 UTC 时间凌晨 0 点运行 (北京时间早上 8 点)
    - cron: '0 0 * * 1'
  workflow_dispatch: # 开启手动点击运行按钮，方便随时测试

jobs:
  run-updater:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      
    steps:
      - name: 获取最新代码
        uses: actions/checkout@v3

      - name: 搭建 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装所需依赖库
        run: pip install -r requirements.txt

      - name: 执行自动化数据抓取与分析
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XHS_API_KEY: ${{ secrets.XHS_API_KEY }}
        run: python update_menu.py

      - name: 将更新后的食谱保存回代码库
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add menu_data.json
          git commit -m "Auto-update: 抓取并新增小红书减脂食谱" || echo "本周没有内容需要更新"
          git push
