name: 小红书菜谱自动抓取与更新

on:
  schedule:
    # 每周一 UTC 时间 0:00 (北京时间早上 8:00) 执行
    - cron: '0 0 * * 1'
  workflow_dispatch: # 允许在 GitHub Actions 页面手动点击运行

jobs:
  update-menu:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予写入代码仓库的权限
      
    steps:
      - name: 检出代码库
        uses: actions/checkout@v3

      - name: 配置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖包
        run: pip install -r requirements.txt

      - name: 执行自动化脚本
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XHS_API_KEY: ${{ secrets.XHS_API_KEY }}
        run: python update_menu.py

      - name: 提交并推送更新的 JSON 数据
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add menu_data.json
          git commit -m "Auto-update: 抓取并新增小红书减脂食谱" || echo "No changes to commit"
          git push
