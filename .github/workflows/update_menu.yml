name: 小红书菜单自动扩充 (Spider_XHS 引擎)

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch: 

jobs:
  run-updater:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: 获取本地代码库
        uses: actions/checkout@v4

      - name: 检出 Spider_XHS 核心爬虫引擎
        run: git clone https://github.com/cv-cat/Spider_XHS.git

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '24' 

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装后端专属依赖库 (切换至智谱SDK)
        run: |
          npm install crypto-js
          cd Spider_XHS && npm install
          cd ..
          # 🌟 核心修改：安装 zhipuai 替换原有的 google-genai
          pip install zhipuai requests
          pip install -r Spider_XHS/requirements.txt

      - name: 执行数据抓取与大模型分析
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}  # 🌟 注入智谱的秘钥
          XHS_COOKIE: ${{ secrets.XHS_COOKIE }}
        run: python update_menu.py

      - name: 提交并推送最新数据
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add menu_data.json
          git commit -m "Auto-update: 使用 Spider_XHS 获取最新食谱" || echo "无新数据更新"
          git pull --rebase origin main
          git push
